name: sheet-grn-loader

on:
  schedule:
    - cron: '17 */3 * * *'    # every 3 hours (off the hour; GitHub crons can start hours late)
  workflow_dispatch:
    inputs:
      source:
        description: 'zepto | amazon | all'
        default: 'all'

# a late scheduled run must not overlap the next one
concurrency:
  group: sheet-grn-loader
  cancel-in-progress: false

# The order-to-cash bridge is NOT refreshed here: o2c_refresh runs on pg_cron at 09:00 and 14:00 IST
# (bc-supabase-sync/o2c/pg_cron_schedule.sql) and deadlocks when a second refresh runs alongside it.

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON((github.event.inputs.source == '' || github.event.inputs.source == 'all') && '["zepto","amazon"]' || format('["{0}"]', github.event.inputs.source)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore the Google token
        run: echo "${{ secrets.GOOGLE_TOKEN_JSON_B64 }}" | base64 -d > token.json
      - name: Load ${{ matrix.source }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}     # session pooler host (IPv4); sslmode=require is fine on runners
          GOOGLE_TOKEN_JSON: token.json
        run: python sheet_grn_loader.py --source ${{ matrix.source }}

  # The never-billed PO list as a Google Sheet for the SCM team (Birbal SCM Tracker, Pending POs view
  # links to it). Runs after the loads on the same 3-hourly beat; reads the SCM Tracker's own snapshot.
  never_billed:
    needs: load
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore the Google token
        run: echo "${{ secrets.GOOGLE_TOKEN_JSON_B64 }}" | base64 -d > token.json
      - name: Rewrite the never-billed POs sheet
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_TOKEN_JSON: token.json
        run: python never_billed_sheet.py

  # Sales targets for the Primary Sales board (Birbal migration 102): the marketing team's monthly
  # "Target Planning <Month> - <Year>" sheets + the Trade team's "Trade Target Planning <Mon>'<yy>" sheets.
  # Not finance's Management MIS: owner's call, 2026-09-28.
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore the Google token
        run: echo "${{ secrets.GOOGLE_TOKEN_JSON_B64 }}" | base64 -d > token.json
      - name: Marketplace + Trade targets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_TOKEN_JSON: token.json
        run: python targets_loader.py

  # Returns-capping RTV% rates (Birbal migration 036) from the same Target Planning sheets' MRO% tab ->
  # public.rtv_capping_pct. Replaced the hand-loaded "<Month> RTV%.xlsx" exports on 2026-09-29. The capping
  # ledger is rebuilt by the o2c_refresh pg_cron beat, not here.
  capping_rates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore the Google token
        run: echo "${{ secrets.GOOGLE_TOKEN_JSON_B64 }}" | base64 -d > token.json
      - name: Capping RTV% rates
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_TOKEN_JSON: token.json
        run: python capping_rates_loader.py

  # Field staff (TSI / promoter) cost by store for Birbal (migrations 132-133), from the confidential
  # "Salary Detail" sheet, which is shared with birbal@ only: its own token secret. Nothing that names a
  # person is stored or logged (staff_salary_loader.py). Skips quietly until the secret exists.
  staff_salary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore birbal@'s Google token
        id: token
        env:
          TOKEN_B64: ${{ secrets.STAFF_SALARY_TOKEN_JSON_B64 }}
        run: |
          if [ -z "$TOKEN_B64" ]; then echo "STAFF_SALARY_TOKEN_JSON_B64 is not set; skipping"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$TOKEN_B64" | base64 -d > token_birbal.json
      - name: Field staff cost by store
        if: steps.token.outputs.skip != '1'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAFF_SALARY_TOKEN_JSON: token_birbal.json
        run: python staff_salary_loader.py

  # Partner RTV support lists + the fixed RTV % in the terms of trade for Birbal's RTV Analysis board
  # (migration 141), from the "Platform wise RTV Data" Drive folder, which is shared with birbal@: birbal@'s
  # Drive token (drive.readonly; the salary token above is Sheets-only and cannot list a folder). Skips
  # quietly until the secret exists.
  rtv_support:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore birbal@'s Drive token
        id: token
        env:
          TOKEN_B64: ${{ secrets.RTV_SUPPORT_TOKEN_JSON_B64 }}
        run: |
          if [ -z "$TOKEN_B64" ]; then echo "RTV_SUPPORT_TOKEN_JSON_B64 is not set; skipping"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$TOKEN_B64" | base64 -d > token_birbal_drive.json
      - name: RTV support + fixed TOT
        if: steps.token.outputs.skip != '1'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RTV_SUPPORT_TOKEN_JSON: token_birbal_drive.json
        run: python rtv_support_loader.py

  # Birbal's Expense Analysis board (migration 151): the finance team's Department / Type of Exp / Expense
  # Month tagging from "Expenses Analysis Report FY27". Same birbal@ Drive token as rtv_support (Drive read
  # scope also reads Sheets). When finance starts a new monthly file, set EXPENSE_SHEET_ID below.
  expense_sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore birbal@'s Drive token
        id: token
        env:
          TOKEN_B64: ${{ secrets.RTV_SUPPORT_TOKEN_JSON_B64 }}
        run: |
          if [ -z "$TOKEN_B64" ]; then echo "RTV_SUPPORT_TOKEN_JSON_B64 is not set; skipping"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$TOKEN_B64" | base64 -d > token_birbal_drive.json
      - name: Expense tagging
        if: steps.token.outputs.skip != '1'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          EXPENSE_SHEET_TOKEN_JSON: token_birbal_drive.json
          # EXPENSE_SHEET_ID: '<new file id>'
        run: python expense_sheet_loader.py

  # Birbal's Receivables board (migration 157): the finance team's "Sundry Debtors Ageing Report <Mon>.<yy>" sheet
  # -- its Customer Master, the cells they type on each weekly tab (DSO, missing invoices, collection aim, PDC,
  # comments) and the Receivable Adj. Details register. The newest file is found by name on Drive, so a new month
  # needs no change here. Same birbal@ Drive token as rtv_support.
  ar_sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore birbal@'s Drive token
        id: token
        env:
          TOKEN_B64: ${{ secrets.RTV_SUPPORT_TOKEN_JSON_B64 }}
        run: |
          if [ -z "$TOKEN_B64" ]; then echo "RTV_SUPPORT_TOKEN_JSON_B64 is not set; skipping"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$TOKEN_B64" | base64 -d > token_birbal_drive.json
      - name: Receivables sheet
        if: steps.token.outputs.skip != '1'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AR_SHEET_TOKEN_JSON: token_birbal_drive.json
        run: python ar_sheet_loader.py

  # Shipper carton sizes for Birbal's WIP intercity freight (migration 163) from the logistics team's "Pending POs"
  # sheet, tab "Carton & MRP". Rewrites wip.ref_carton_size and rebuilds the per-SKU freight only when the sheet
  # changed. The instamart@ token reads the sheet.
  carton_size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore the Google token
        run: echo "${{ secrets.GOOGLE_TOKEN_JSON_B64 }}" | base64 -d > token.json
      - name: Carton sizes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_TOKEN_JSON: token.json
        run: python carton_size_loader.py
