name: sheet-grn-loader

on:
  schedule:
    - cron: '17 */3 * * *'    # every 3 hours (off the hour; GitHub crons can start hours late)
  workflow_dispatch:
    inputs:
      source:
        description: 'zepto | amazon | all'
        default: 'all'

# a late scheduled run must not overlap the next one
concurrency:
  group: sheet-grn-loader
  cancel-in-progress: false

# The order-to-cash bridge is NOT refreshed here: o2c_refresh runs on pg_cron at 09:00 and 14:00 IST
# (bc-supabase-sync/o2c/pg_cron_schedule.sql) and deadlocks when a second refresh runs alongside it.

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON((github.event.inputs.source == '' || github.event.inputs.source == 'all') && '["zepto","amazon"]' || format('["{0}"]', github.event.inputs.source)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore the Google token
        run: echo "${{ secrets.GOOGLE_TOKEN_JSON_B64 }}" | base64 -d > token.json
      - name: Load ${{ matrix.source }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}     # session pooler host (IPv4); sslmode=require is fine on runners
          GOOGLE_TOKEN_JSON: token.json
        run: python sheet_grn_loader.py --source ${{ matrix.source }}

  # The never-billed PO list as a Google Sheet for the SCM team (Birbal SCM Tracker, Pending POs view
  # links to it). Runs after the loads on the same 3-hourly beat; reads the SCM Tracker's own snapshot.
  never_billed:
    needs: load
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore the Google token
        run: echo "${{ secrets.GOOGLE_TOKEN_JSON_B64 }}" | base64 -d > token.json
      - name: Rewrite the never-billed POs sheet
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_TOKEN_JSON: token.json
        run: python never_billed_sheet.py

  # Sales targets for the Primary Sales board (Birbal migration 102): the marketing team's monthly
  # "Target Planning <Month> - <Year>" sheets (Marketplace, party x category) and finance's
  # "Management MIS FY27" sheet (Trade, channel level). Each half replaces only the months it read.
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore the Google tokens
        run: |
          echo "${{ secrets.GOOGLE_TOKEN_JSON_B64 }}" | base64 -d > token.json
          # the MIS sheet opens with finance's share; a separate token only if one was stored
          if [ -n "${{ secrets.GOOGLE_TOKEN_JSON_TRADE_B64 }}" ]; then echo "${{ secrets.GOOGLE_TOKEN_JSON_TRADE_B64 }}" | base64 -d > token_trade.json; else cp token.json token_trade.json; fi
      - name: Marketplace targets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_TOKEN_JSON: token.json
        run: python targets_loader.py --source marketplace
      - name: Trade targets
        # red until the MIS sheet is shared with the loader's account (or GOOGLE_TOKEN_JSON_TRADE_B64 is set);
        # the Marketplace half does not depend on it
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_TOKEN_JSON: token.json
          GOOGLE_TOKEN_JSON_TRADE: token_trade.json
        run: python targets_loader.py --source trade
